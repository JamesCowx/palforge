<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <!-- Anvil base -->
  <rect x="10" y="26" width="40" height="26" rx="5" fill="url(#pf-grad)"/>
  <rect x="18" y="18" width="24" height="10" rx="4" fill="#fff" opacity="0.9"/>
  <rect x="14" y="34" width="8" height="6" rx="1" fill="#fff" opacity="0.6"/>
  <rect x="38" y="34" width="8" height="6" rx="1" fill="#fff" opacity="0.6"/>
  <!-- Hammer -->
  <rect x="46" y="8" width="16" height="16" rx="4" fill="url(#pf-grad)"/>
  <rect x="48" y="12" width="5" height="8" rx="1.5" fill="#fff" opacity="0.3"/>
  <rect x="54" y="24" width="4" height="18" rx="2" fill="url(#pf-grad)"/>
  <!-- Spark -->
  <circle cx="38" cy="18" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="38" cy="18" r="7" fill="#fbbf24" opacity="0.15" filter="url(#glow)"/>
  <!-- Glow filter -->
  <filter id="glow">
    <feGaussianBlur stdDeviation="2" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</svg>
