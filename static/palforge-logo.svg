<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <linearGradient id="pf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Anvil shape -->
    <rect x="8" y="22" width="44" height="24" rx="4" fill="url(#pf-grad)" stroke="none"/>
    <rect x="16" y="14" width="28" height="10" rx="3" fill="#fff" opacity="0.9"/>
    <rect x="12" y="30" width="8" height="6" rx="1" fill="#fff" opacity="0.7"/>
    <rect x="36" y="30" width="8" height="6" rx="1" fill="#fff" opacity="0.7"/>
    <!-- Hammer head -->
    <rect x="60" y="10" width="30" height="20" rx="4" fill="url(#pf-grad)" stroke="none"/>
    <rect x="64" y="14" width="8" height="12" rx="2" fill="#fff" opacity="0.3"/>
    <!-- Hammer handle -->
    <rect x="74" y="30" width="6" height="20" rx="3" fill="url(#pf-grad)" stroke="none"/>
    <!-- Spark/star glow -->
    <circle cx="145" cy="24" r="4" fill="#fbbf24" opacity="0.9"/>
    <circle cx="145" cy="24" r="8" fill="#fbbf24" opacity="0.2"/>
    <circle cx="160" cy="36" r="2.5" fill="#c084fc" opacity="0.7"/>
    <circle cx="160" cy="36" r="6" fill="#c084fc" opacity="0.15"/>
    <!-- Small sparkle -->
    <circle cx="130" cy="40" r="1.5" fill="#818cf8" opacity="0.6"/>
  </g>
  <text x="55" y="48" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="url(#pf-grad)" letter-spacing="1">PalForge</text>
</svg>
